{% extends "main.html" %}

{% block main %}
<form id="form">
    <input type="hidden" id="id" name="id">

    <div class="container my-4">
        <div class="card shadow-sm border-0">

            <!-- HEADER -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

                <h5 class="mb-0 d-flex align-items-center gap-2">
                    <i class="fas fa-users"></i> Lista de Clientes
                </h5>

                <div class="d-flex gap-2">
                    <a href="/cliente/cadastro" class="btn btn-success btn-sm d-flex align-items-center gap-2">
                        <i class="fas fa-plus"></i> Cadastrar
                    </a>

                    <a href="/cliente/print" target="_blank"
                       class="btn btn-light btn-sm d-flex align-items-center gap-2">
                        <i class="fas fa-print"></i> Imprimir
                    </a>
                </div>

            </div>

            <!-- BODY -->
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle" id="tabela">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-hashtag"></i> Código</th>
                                <th><i class="fas fa-user"></i> Nome</th>
                                <th><i class="fas fa-user"></i> Sobrenome</th>
                                <th><i class="fas fa-envelope"></i> CPF/CNPJ</th>
                                <th><i class="fas fa-calendar"></i> RG </th>
                                <th><i class="fas fa-check-circle"></i> Status</th>
                                <th class="text-center"><i class="fas fa-cogs"></i> Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block script %}
    {% include "script.html" %}
    <script defer type="module" src="/js/listcliente.js"></script>
{% endblock %}
