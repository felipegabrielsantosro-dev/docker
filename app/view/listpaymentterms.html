{% extends "main.html" %}

{% block main %}

<div class="container-fluid my-4">

    <!-- HEADER / BREADCRUMB -->
    <div class="row mb-3">
        <div class="col-sm-6">
            <h3 class="mb-0">{{ titulo }}</h3>
        </div>
        <div class="col-sm-6">
            <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="/home">Início</a></li>
                <li class="breadcrumb-item active" aria-current="page">Condições de Pagamento</li>
            </ol>
        </div>
    </div>

    <!-- CARD PRINCIPAL -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0">

                <!-- HEADER DO CARD -->
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 d-flex align-items-center gap-2">
                        <i class="fas fa-cash-register"></i>
                        Condições de Pagamento
                    </h5>

                    <div class="d-flex gap-2">
                        <a href="/pagamento/cadastro" class="btn btn-success btn-sm d-flex align-items-center gap-2">
                            <i class="fas fa-plus-circle"></i>
                            Novo Cadastro
                        </a>
                        <button class="btn btn-info btn-sm d-flex align-items-center gap-2" onclick="imprimirTabela()">
                            <i class="fas fa-print"></i>
                            Imprimir
                        </button>
                    </div>
                </div>

                <!-- BODY DO CARD -->
                <div class="card-body">

                    <!-- BUSCA -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input
                                    type="text"
                                    id="search"
                                    class="form-control"
                                    placeholder="Buscar condição de pagamento..."
                                >
                            </div>
                        </div>
                    </div>

                    <!-- TABELA RESPONSIVA -->
                    <div class="table-responsive" id="tabela-container">
                        <table class="table table-striped table-hover table-bordered align-middle" id="tabela">
                            <thead class="table-light">
                                <tr>
                                    <th><i class="fas fa-hashtag"></i> Código</th>
                                    <th><i class="fas fa-money-bill-wave"></i> Valor</th>
                                    <th><i class="fas fa-layer-group"></i> Parcelas</th>
                                    <th><i class="fas fa-id-card"></i> CPF</th>
                                    <th><i class="fas fa-id-card-alt"></i> RG</th>
                                    <th class="text-center"><i class="fas fa-cogs"></i> Ação</th>
                                </tr>
                            </thead>
                            <tbody>
                                {# Preenchido via JS #}
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
{% include 'script.html' %}
<script defer type="module" src="/js/listpaymentterms.js"></script>

<script>
// Função para imprimir a tabela
function imprimirTabela() {
    const tabelaConteudo = document.getElementById('tabela-container').innerHTML;
    const janela = window.open('', '', 'width=900,height=600');
    janela.document.write('<html><head><title>Imprimir Tabela</title>');
    janela.document.write('<link rel="stylesheet" href="/path/to/bootstrap.min.css">'); // se quiser o estilo
    janela.document.write('</head><body>');
    janela.document.write(tabelaConteudo);
    janela.document.write('</body></html>');
    janela.document.close();
    janela.print();
}
</script>
{% endblock %}
