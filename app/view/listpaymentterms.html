{% extends "main.html" %}

{% block main %}
<div class="app-content-header">
    <div class="container-fluid">

        <!-- TÍTULO + BREADCRUMB -->
        <div class="row mb-3">
            <div class="col-sm-6">
                <h3 class="mb-0">{{ titulo }}</h3>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-end mb-0">
                    <li class="breadcrumb-item">
                        <a href="/home">Início</a>
                    </li>
                    <li class="breadcrumb-item active">
                        Termos de Pagamento
                    </li>
                </ol>
            </div>
        </div>

        <!-- CONTEÚDO -->
        <div class="row">
            <div class="col-12">
                <div class="card">

                    <!-- HEADER -->
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">
                            Pesquisa de Termos de Pagamento
                        </span>

                        <div class="btn-group">
                            <a href="/pagamento/cadastro" class="btn btn-success btn-sm">
                                <i class="bi bi-plus-circle"></i>
                                Cadastrar
                            </a>

                            <button class="btn btn-primary btn-sm" onclick="window.print()">
                                <i class="bi bi-printer"></i>
                                Imprimir
                            </button>
                        </div>
                    </div>

                    <!-- BODY -->
                    <div class="card-body" id="area-impressao">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered align-middle"
                                   id="tabela">
                                <thead class="table-light">
                                    <tr>
                                        <th>Código</th>
                                        <th>Cód. Cond. Pagamento</th>
                                        <th>Condição</th>
                                        <th>Atalho</th>
                                        <th class="text-center" style="width:120px;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- preenchido via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block script %}
    {% include 'script.html' %}
    <script type="module" src="/js/listpaymentterms.js"></script>
{% endblock %}
