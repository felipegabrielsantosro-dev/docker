{% extends "main.html" %}

{% block main %}

<div class="container my-4">

    <!-- BREADCRUMB -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Início</a></li>
            <li class="breadcrumb-item active" aria-current="page">Condições de Pagamento</li>
        </ol>
    </nav>

    <div class="card shadow-sm border-0">

        <!-- HEADER -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 d-flex align-items-center gap-2">
                <i class="fas fa-cash-register"></i>
                Condições de Pagamento
            </h5>

            <a href="/pagamento/cadastro" class="btn btn-success btn-sm d-flex align-items-center gap-2">
                <i class="fas fa-plus-circle"></i>
                Novo Cadastro
            </a>
        </div>

        <!-- BODY -->
        <div class="card-body">

            <!-- BUSCA -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input
                            type="text"
                            id="search"
                            class="form-control"
                            placeholder="Buscar condição de pagamento..."
                        >
                    </div>
                </div>
            </div>

            <!-- TABELA -->
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tabela">
                    <thead class="table-light">
                        <tr>
                            <th><i class="fas fa-hashtag"></i> Código</th>
                            <th><i class="fas fa-money-bill-wave"></i> Valor</th>
                            <th><i class="fas fa-layer-group"></i> Parcelas</th>
                            <th><i class="fas fa-calendar-alt"></i> Data</th>
                            <th><i class="fas fa-check-circle"></i> Status</th>
                            <th class="text-center">
                                <i class="fas fa-cogs"></i> Ações
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        {# Preenchido via JS #}
                    </tbody>
                </table>
            </div>

        </div>

    </div>
</div>

{% endblock %}

{% block script %}
{% include "script.html" %}
<script defer type="module" src="/js/listpaymentterms.js"></script>
{% endblock %}
