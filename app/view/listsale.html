{% extends "main.html" %}

{% block main %}
<div class="app-content-header">
    <div class="container-fluid">

        <!-- TÍTULO + BREADCRUMB -->
        <div class="row mb-3">
            <div class="col-sm-6">
                <h3 class="mb-0">{{ titulo }}</h3>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-end mb-0">
                    <li class="breadcrumb-item">
                        <a href="/home">Início</a>
                    </li>
                    <li class="breadcrumb-item active">Vendas</li>
                </ol>
            </div>
        </div>

        <!-- FORMULÁRIO -->
        <div class="row">
            <div class="col-12">
                <form id="form">
                    <input type="hidden" id="acao" name="acao" value="{{ acao }}">
                    <input type="hidden" id="id" name="id" value="{{ id }}">

                    <div class="card">

                        <!-- HEADER DO CARD -->
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="fw-semibold">Filtrar Vendas</span>
                            <a href="/venda/cadastro" class="btn btn-primary btn-sm">
                                <i class="fa-solid fa-plus"></i>
                                Nova Venda
                            </a>
                        </div>

                        <!-- BODY DO CARD -->
                        <div class="card-body">
                            <div class="row g-3 align-items-center">

                                <div class="col-md-6">
                                    <label for="select-field" class="form-label">Escolha um filtro</label>
                                    <div class="input-group">
                                        <select class="form-select" id="select-field" aria-label="Filtro de vendas">
                                            <option selected>Escolha...</option>
                                            <option value="1">Cliente</option>
                                            <option value="2">Data</option>
                                            <option value="3">Status</option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button">
                                            <i class="bi bi-search"></i> Filtrar
                                        </button>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="search" class="form-label">Pesquisar</label>
                                    <input type="text" id="search" class="form-control" placeholder="Digite para buscar...">
                                </div>

                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block script %}
{% include 'script.html' %}
<script defer type="module" src="/js/listsale.js"></script>
{% endblock %}
