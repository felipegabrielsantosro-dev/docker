{% extends "main.html" %}

{% block main %}
<form id="formPagamento">
    <input type="hidden" id="id" name="id">

    <div class="container my-4">
        <div class="card shadow-sm border-0">

            <!-- HEADER -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 d-flex align-items-center gap-2">
                    <i class="fas fa-cash-register"></i> Cadastro de Pagamento
                </h5>

                <a href="/pagamento/lista" class="btn btn-light d-flex align-items-center gap-2">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>

            <!-- BODY -->
            <div class="card-body">
                <div class="row g-3">

                    <!-- CLIENTE -->
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Cliente
                        </label>
                        <select id="cliente_id" name="cliente_id" class="form-select" required>
                            <option value="">Selecione o cliente</option>
                        </select>
                    </div>

                    <!-- VALOR -->
                    <div class="col-md-3">
                        <label class="form-label">
                            <i class="fas fa-money-bill-wave"></i> Valor Total
                        </label>
                        <input type="number" step="0.01" class="form-control" id="valor" name="valor" required>
                    </div>

                    <!-- DATA -->
                    <div class="col-md-3">
                        <label class="form-label">
                            <i class="fas fa-calendar-alt"></i> Data
                        </label>
                        <input type="date" class="form-control" id="data_pagamento" name="data_pagamento" required>
                    </div>

                    <!-- FORMA -->
                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fas fa-credit-card"></i> Forma de Pagamento
                        </label>
                        <select id="forma_pagamento" name="forma_pagamento" class="form-select" required>
                            <option value="">Selecione</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="pix">PIX</option>
                            <option value="credito">Cartão de Crédito</option>
                            <option value="debito">Cartão de Débito</option>
                            <option value="boleto">Boleto</option>
                        </select>
                    </div>

                    <!-- PARCELAMENTO -->
                    <div class="col-md-4 d-none" id="grupoParcelas">
                        <label class="form-label">
                            <i class="fas fa-layer-group"></i> Parcelas
                        </label>
                        <select id="parcelas" name="parcelas" class="form-select">
                            {% for i in 1..12 %}
                                <option value="{{ i }}">{{ i }}x</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- VALOR DA PARCELA -->
                    <div class="col-md-4 d-none" id="grupoValorParcela">
                        <label class="form-label">
                            <i class="fas fa-calculator"></i> Valor da Parcela
                        </label>
                        <input type="text" id="valor_parcela" class="form-control" readonly>
                    </div>

                    <!-- STATUS -->
                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fas fa-check-circle"></i> Status
                        </label>
                        <select id="status" name="status" class="form-select" required>
                            <option value="pago">Pago</option>
                            <option value="pendente">Pendente</option>
                        </select>
                    </div>

                    <!-- OBS -->
                    <div class="col-md-12">
                        <label class="form-label">
                            <i class="fas fa-comment-dots"></i> Observação
                        </label>
                        <textarea class="form-control" id="observacao" name="observacao" rows="3"></textarea>
                    </div>

                </div>
            </div>

            <!-- FOOTER -->
            <div class="card-footer d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-secondary">
                    <i class="fas fa-eraser"></i> Limpar
                </button>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Salvar
                </button>
            </div>

        </div>
    </div>
</form>
{% endblock %}

{% block script %}
{% include "script.html" %}
<script defer type="module" src="/js/paymentterms.js"></script>
{% endblock %}
