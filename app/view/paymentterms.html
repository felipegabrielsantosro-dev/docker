{% extends "main.html" %}

{% block main %}
<form id="formPagamento" autocomplete="off">
    <input type="hidden" id="id" name="id">

    <div class="container my-4">
        <div class="card shadow-sm border-0">

            <!-- HEADER -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0 d-flex align-items-center gap-2">
                        <i class="fas fa-cash-register"></i>
                        Cadastro de Pagamento
                    </h5>
                    <small class="opacity-75">
                        Informe os dados do pagamento realizado ou pendente
                    </small>
                </div>

                <a href="/pagamento/lista" class="btn btn-light d-flex align-items-center gap-2">
                    <i class="fas fa-arrow-left"></i>
                    Voltar
                </a>
            </div>

            <!-- BODY -->
            <div class="card-body">
                <div class="row g-3">

                    <!-- CLIENTE -->
                    <div class="col-md-6">
                        <label for="cliente_id" class="form-label">
                            <i class="fas fa-user"></i> Cliente
                        </label>
                        <select
                            id="cliente_id"
                            name="cliente_id"
                            class="form-select"
                            required
                        >
                            <option value="">Selecione o cliente</option>
                        </select>
                    </div>

                    <!-- DATA -->
                    <div class="col-md-3">
                        <label for="data_pagamento" class="form-label">
                            <i class="fas fa-calendar-alt"></i> Data do Pagamento
                        </label>
                        <input
                            type="date"
                            class="form-control"
                            id="data_pagamento"
                            name="data_pagamento"
                            required
                        >
                    </div>

                    <!-- VALOR -->
                    <div class="col-md-3">
                        <label for="valor" class="form-label text-end w-100">
                            <i class="fas fa-money-bill-wave"></i> Valor Total
                        </label>
                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            class="form-control text-end"
                            id="valor"
                            name="valor"
                            placeholder="0,00"
                            required
                        >
                    </div>

                    <hr class="my-3">

                    <!-- FORMA -->
                    <div class="col-md-4">
                        <label for="forma_pagamento" class="form-label">
                            <i class="fas fa-credit-card"></i> Forma de Pagamento
                        </label>
                        <select
                            id="forma_pagamento"
                            name="forma_pagamento"
                            class="form-select"
                            required
                        >
                            <option value="">Selecione</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="pix">PIX</option>
                            <option value="credito">Cartão de Crédito</option>
                            <option value="debito">Cartão de Débito</option>
                            <option value="boleto">Boleto</option>
                        </select>
                    </div>

                    <!-- PARCELAS -->
                    <div class="col-md-4 d-none" id="grupoParcelas">
                        <label for="parcelas" class="form-label">
                            <i class="fas fa-layer-group"></i> Parcelas
                        </label>
                        <select id="parcelas" name="parcelas" class="form-select">
                            {% for i in 1..12 %}
                                <option value="{{ i }}">{{ i }}x</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- VALOR DA PARCELA -->
                    <div class="col-md-4 d-none" id="grupoValorParcela">
                        <label class="form-label text-end w-100">
                            <i class="fas fa-calculator"></i> Valor por Parcela
                        </label>
                        <input
                            type="text"
                            id="valor_parcela"
                            class="form-control text-end"
                            placeholder="0,00"
                            readonly
                        >
                    </div>

                    <hr class="my-3">

                    <!-- STATUS -->
                    <div class="col-md-4">
                        <label for="status" class="form-label">
                            <i class="fas fa-check-circle"></i> Status do Pagamento
                        </label>
                        <select
                            id="status"
                            name="status"
                            class="form-select"
                            required
                        >
                            <option value="pago">Pago</option>
                            <option value="pendente">Pendente</option>
                        </select>
                    </div>

                    <!-- OBSERVAÇÃO -->
                    <div class="col-md-8">
                        <label for="observacao" class="form-label">
                            <i class="fas fa-comment-dots"></i> Observação
                        </label>
                        <textarea
                            class="form-control"
                            id="observacao"
                            name="observacao"
                            rows="3"
                            placeholder="Ex: pagamento referente à venda #123"
                        ></textarea>
                    </div>

                </div>
            </div>

            <!-- FOOTER -->
            <div class="card-footer d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    <i class="fas fa-info-circle"></i>
                    Campos obrigatórios
                </small>

                <div class="d-flex gap-2">
                    <button type="reset" class="btn btn-outline-secondary">
                        <i class="fas fa-eraser"></i> Limpar
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </div>

        </div>
    </div>
</form>
{% endblock %}

{% block script %}
{% include "script.html" %}
<script defer type="module" src="/js/paymentterms.js"></script>
{% endblock %}
